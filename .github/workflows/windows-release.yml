name: Windows EXE Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller==6.20.0
      - name: Test business rules and desktop flow
        run: python -m pytest -q
      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SalaryConsolidator-v2.0 --collect-all msoffcrypto app.py
      - name: Verify packaged EXE starts
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'salary-gui-check.txt'
          $process = Start-Process -FilePath '.\dist\SalaryConsolidator-v2.0.exe' -ArgumentList @('--self-test', $result) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'EXE startup timed out' }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result) -or (Get-Content $result) -ne 'ok') { throw 'Packaged GUI smoke test failed' }
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item dist\SalaryConsolidator-v2.0.exe package\
          Copy-Item README.md, CHANGELOG.md package\
          Copy-Item docs\COMPARISON.md package\
          Compress-Archive -Path package\* -DestinationPath SalaryConsolidator-v2.0-Windows.zip
          Get-FileHash SalaryConsolidator-v2.0-Windows.zip -Algorithm SHA256 | Format-List | Out-File SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SalaryConsolidator-v2.0-Windows
          path: |
            SalaryConsolidator-v2.0-Windows.zip
            SHA256SUMS.txt
      - name: Publish v2.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v2.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title '集团工资汇总 v2.0 · Windows桌面版' --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v2.0 SalaryConsolidator-v2.0-Windows.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
